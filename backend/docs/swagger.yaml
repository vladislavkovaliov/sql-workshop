basePath: /api
definitions:
  dto.CursorProductsResponse:
    properties:
      next_cursor:
        type: integer
      products:
        items:
          $ref: '#/definitions/dto.ProductResponse'
        type: array
    type: object
  dto.ProductResponse:
    properties:
      id:
        example: 1
        type: integer
      price:
        example: 150
        type: number
      title:
        example: Keyboard
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Educational SQL workshop backend API
  title: Shop API
  version: "1.0"
paths:
  /products:
    get:
      description: Returns all products from the database
      parameters:
      - description: Number of products to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of products to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ProductResponse'
            type: array
      summary: List all products
      tags:
      - products
  /products/cursor:
    get:
      description: Returns products with cursor-based pagination. Pass the last product
        ID from the previous response as cursor.
      parameters:
      - description: Number of products to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Last product ID from previous page
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CursorProductsResponse'
      summary: List products (cursor-based)
      tags:
      - products
swagger: "2.0"
